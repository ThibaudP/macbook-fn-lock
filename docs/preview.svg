<svg xmlns="http://www.w3.org/2000/svg" width="720" height="264" viewBox="0 0 720 264">
  <title>MacBook Fn Lock interface illustration</title>
  <desc>Two examples of the menu: Fn Lock off in Multimedia mode, and Fn Lock on in F1-F12 mode.</desc>
  <defs>
    <g id="fn">
      <rect x="1.7" y="2.7" width="16.6" height="14.6" rx="3" fill="currentColor" stroke="#53575e" stroke-width="1.6"/>
      <path d="M7.1 14V7.8c0-1.4.9-2 2.3-1.5M5.5 9h3.6M10.8 14V9m0 2c0-2.8 3.7-2.8 3.7 0v3" fill="none" stroke="#23262b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="720" height="264" rx="16" fill="#15171b"/>
  <g font-family="Cantarell, Noto Sans, sans-serif" fill="#f4f4f5">
    <g transform="translate(22 22)">
      <rect width="327" height="32" rx="8" fill="#24262c"/>
      <text x="14" y="21" font-size="12" fill="#b9bbc3">Multimedia keys</text>
      <use href="#fn" x="290" y="6" color="#b9bbc3"/>
      <rect x="0" y="43" width="327" height="149" rx="14" fill="#303239" stroke="#484a52"/>
      <text x="20" y="79" font-size="15" font-weight="600">Fn Lock</text>
      <rect x="263" y="63" width="43" height="23" rx="11.5" fill="#676a74"/>
      <circle cx="275" cy="74.5" r="8.5" fill="#f4f4f5"/>
      <text x="20" y="117" font-size="14" fill="#d1d3da">Multimedia mode</text>
      <path d="M20 136h287" stroke="#50525a"/>
      <text x="20" y="168" font-size="13" fill="#b9bbc3">Double tap Fn to change mode</text>
    </g>
    <g transform="translate(371 22)">
      <rect width="327" height="32" rx="8" fill="#24262c"/>
      <text x="14" y="21" font-size="12" fill="#b9bbc3">Function keys</text>
      <use href="#fn" x="290" y="6" color="#78aeed"/>
      <rect x="0" y="43" width="327" height="149" rx="14" fill="#303239" stroke="#484a52"/>
      <text x="20" y="79" font-size="15" font-weight="600">Fn Lock</text>
      <rect x="263" y="63" width="43" height="23" rx="11.5" fill="#3584e4"/>
      <circle cx="294" cy="74.5" r="8.5" fill="#ffffff"/>
      <text x="20" y="117" font-size="14" fill="#d1d3da">F1-F12 mode</text>
      <path d="M20 136h287" stroke="#50525a"/>
      <text x="20" y="168" font-size="13" fill="#b9bbc3">Double tap Fn to change mode</text>
    </g>
    <text x="360" y="243" text-anchor="middle" font-size="12" fill="#8e929f">GNOME Shell 51 · Apple keyboards on Linux</text>
  </g>
</svg>
